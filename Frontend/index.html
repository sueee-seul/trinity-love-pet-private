<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Wagstay paw in every theme. The ICO and PNG come from the SVG (scripts/generate-brand-icons.mjs).
         /favicon.svg once held Vite's logo, and browsers keep a tab icon by its address, so the
         links carry a version. Raise it whenever the icon files change. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wagstay is a boarding hotel for dogs and cats. Plan a stay with our booking assistant and see the full price, GST included, before you send a request."
    />
    <title>Wagstay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
